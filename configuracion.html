<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VextoERP | Configuración de Empresa</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#7263f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VextoERP">
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
</head>
<body>
  <div class="app-layout">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-badge">
          <img src="vextologo1.png" alt="VextoERP" id="sidebarLogoImg">
        </div>
        <div class="sidebar-brand-text">
          <span class="brand-name" id="sidebarBrandName">VextoERP</span>
          <span class="brand-sub">Facturación & Inventario</span>
        </div>
      </div>
      <script>
        // Aplica el logo/nombre de la empresa ANTES de pintar, usando la última
        // copia guardada en este navegador, para no mostrar "VextoERP" ni su
        // logo por defecto mientras se confirma la configuración con Firebase.
        (function () {
          try {
            var cached = localStorage.getItem('vexto_company_branding_cache');
            if (!cached) return;
            var data = JSON.parse(cached);
            if (data.businessName) document.getElementById('sidebarBrandName').textContent = data.businessName;
            if (data.logo) document.getElementById('sidebarLogoImg').src = data.logo;
          } catch (e) {}
        })();
      </script>

      <nav class="sidebar-nav">
        <div class="nav-section">Principal</div>
        <a href="facturacion.html" class="nav-item">
          <span class="nav-icon">🧾</span>
          <span>Facturación</span>
        </a>
        <a href="historial.html" class="nav-item">
          <span class="nav-icon">📋</span>
          <span>Historial</span>
        </a>
        <a href="clientes.html" class="nav-item">
          <span class="nav-icon">👥</span>
          <span>Clientes</span>
        </a>
        <a href="inventario.html" class="nav-item">
          <span class="nav-icon">📦</span>
          <span>Inventario</span>
        </a>
        <div class="nav-section" id="accountNavSection">Cuenta</div>
        <a href="configuracion.html" class="nav-item active" id="companyNavItem">
          <span class="nav-icon">🏢</span>
          <span>Mi Empresa</span>
        </a>
        <a href="equipo.html" class="nav-item" id="teamNavItem">
          <span class="nav-icon">🧑‍🤝‍🧑</span>
          <span>Mi Equipo</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">A</div>
          <div class="user-details">
            <span class="user-name">—</span>
            <span class="user-role">—</span>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <span>🚪</span>
          <span>Cerrar Sesión</span>
        </button>
        <div class="version-badge" id="versionBadge"></div>
      </div>
    </aside>

    <!-- ============ CONTENIDO PRINCIPAL ============ -->
    <main class="main-content">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-toggle" aria-label="Abrir menú">☰</button>
          <h2>🏢 Mi Empresa</h2>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="todayDate"></span>
        </div>
      </header>

      <div class="content-area">
        <div class="card" style="max-width: 640px;">
          <div class="card-header">
            <h3>🎨 Personalización</h3>
          </div>

          <form id="companyForm" novalidate>
            <div class="modal-body" style="padding: 24px;">
              <div class="form-group">
                <label>Logo del negocio</label>
                <div class="photo-upload">
                  <div class="photo-preview" id="companyLogoPreview">
                    <span id="companyLogoPlaceholder">🏢</span>
                    <img id="companyLogoImg" class="hidden" alt="Logo del negocio">
                  </div>
                  <div class="photo-upload-actions">
                    <input type="file" id="companyLogoInput" accept="image/*" class="hidden">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('companyLogoInput').click()">📷 Elegir logo</button>
                    <button type="button" class="btn btn-secondary btn-sm hidden" id="removeLogoBtn" onclick="removeCompanyLogo()">✕ Quitar</button>
                  </div>
                </div>
                <div class="hint">Aparece en el menú lateral y en el comprobante de venta.</div>
              </div>

              <div class="form-group">
                <label for="businessName">Nombre del negocio *</label>
                <input type="text" id="businessName" placeholder="Ej: Colmado Doña Ana" required>
              </div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label for="businessTaxId">RNC / Cédula</label>
                  <input type="text" id="businessTaxId" placeholder="Ej: 130-12345-6">
                </div>
                <div class="form-group">
                  <label for="businessPhone">Teléfono</label>
                  <input type="text" id="businessPhone" placeholder="Ej: 809-555-0000">
                </div>
              </div>

              <div class="form-group">
                <label for="businessAddress">Dirección</label>
                <input type="text" id="businessAddress" placeholder="Ej: Calle Principal #12, Santiago">
              </div>

              <div class="form-group">
                <label for="businessEmail">Correo electrónico</label>
                <input type="email" id="businessEmail" placeholder="Ej: contacto@minegocio.com">
              </div>

              <div class="form-group">
                <label for="receiptFooter">Nota al pie del comprobante</label>
                <textarea id="receiptFooter" rows="2" placeholder="Ej: ¡Gracias por su compra! No se aceptan devoluciones después de 7 días."></textarea>
                <div class="hint">Se muestra al final de cada comprobante de venta.</div>
              </div>
            </div>

            <div class="modal-footer">
              <button type="submit" class="btn btn-primary" id="saveCompanyBtn">💾 Guardar Cambios</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/configuracion.js"></script>
</body>
</html>
